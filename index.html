<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Node — Infrastructure Born in a Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#666; --border:#e8e8e8; --card:#fff; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--fg);line-height:1.6}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif}
  .container{max-width:1100px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;backdrop-filter:blur(12px);background:rgba(250,250,250,0.8);border-bottom:1px solid var(--border);z-index:10}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:72px}
  .logo-wrap{display:flex;align-items:center;gap:12px;font-weight:700;font-family:'Space Grotesk';font-size:18px}
  .logo-img{width:40px;height:40px;border-radius:999px;background:#fff;border:1px solid var(--border)}
  .nav-links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
  .nav-links a{text-decoration:none;color:inherit}
  .btn{padding:10px 18px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-weight:600;font-size:14px;display:inline-block}
  .hero{padding:100px 0 60px;display:grid;grid-template-columns:1.2fr 0.8fr;gap:60px;align-items:center}
  .hero h1{font-size:64px;line-height:0.95;letter-spacing:-0.04em;margin-bottom:20px}
  .hero p{font-size:18px;color:var(--muted);max-width:520px;margin-bottom:28px}
  .stats{display:flex;gap:24px;margin-top:32px}
  .stat{border-top:1px solid var(--border);padding-top:12px;flex:1}
  .stat b{font-size:20px;display:block}
  .stat span{font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)}
  .hero-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px}
  .chain-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .chain{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#fafafa;font-weight:600;font-size:14px}
  .dot{width:8px;height:8px;border-radius:999px;background:#111}
  .story{padding:80px 0;border-top:1px solid var(--border);display:grid;grid-template-columns:0.8fr 1.2fr;gap:60px}
  .features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:60px 0}
  .feat{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px}
  footer{border-top:1px solid var(--border);padding:40px 0;margin-top:60px;display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
  @media(max-width:800px){.hero,.story{grid-template-columns:1fr}.hero h1{font-size:42px}.features{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <div class="container nav-inner">
    <div class="logo-wrap">
      <img src="garage_node_simple_2.png" class="logo-img" alt="Garage Node"> GARAGE NODE
    </div>
    <div class="nav-links"><a href="#story">Story</a><a href="#networks">Networks</a><a href="#why">Why Us</a></div>
    <a class="btn" href="#delegate">Delegate Now</a>
  </div>
</nav>
<!-- ... rest same as file ... -->
</body>
</html>
